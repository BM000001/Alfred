name: Deploy Alfred to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build production site
        env:
          ALFRED_PAGES_BASE: /Alfred/
          VITE_GOOGLE_APPS_SCRIPT_URL: ${{ vars.VITE_GOOGLE_APPS_SCRIPT_URL }}
          VITE_GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.VITE_GOOGLE_CALENDAR_CLIENT_ID }}
        run: npm run build:pages

      - name: Verify production resource paths
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/apple-touch-icon-180.png
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          test -s dist/icon-maskable-512.png
          grep -Fq 'href="/Alfred/manifest.webmanifest"' dist/index.html
          grep -Fq 'src="/Alfred/assets/' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site responds
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --output /tmp/alfred-pages.html --write-out '%{http_code}' "$SITE_URL" || true)
            if [ "$status" = "200" ] && grep -q 'id="root"' /tmp/alfred-pages.html; then
              echo "GitHub Pages is serving Alfred successfully at $SITE_URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; waiting for Pages propagation..."
            sleep 10
          done
          echo "GitHub Pages did not serve the expected Alfred index at $SITE_URL"
          exit 1
